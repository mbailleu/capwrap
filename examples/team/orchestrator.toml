# orchestrator: Break work down, hand it out, and keep track of who has what.
#
# Prompts reach this container three ways, all visible below:
#   1. role_prompt = "prompts/orchestrator.md" is bound at /run/capwrap-role.md
#      and wired into the system prompt (Claude reads it via a flag capwrap inserts)
#   2. prompts/house.md is bound in as /work/CLAUDE.md, the project memory
#   3. the worktree is the working context
#
#   capwrap up examples/team/*.toml

name = "orchestrator"

[runtime]
command = [
  "/opt/claude/claude",
]
# The role is a *system* prompt, not a message: it survives compaction and the
# agent cannot talk itself out of it mid-session. capwrap binds the file at
# /run/capwrap-role.md and inserts --append-system-prompt-file after the binary.
role_prompt = "prompts/orchestrator.md"
cwd       = "/work"
tty       = true
approvals = "capwrap"

auto_allow = ["Read", "Glob", "Grep", "TodoWrite"]
auto_deny  = ["Bash(sudo *)"]

env_from_host = ["ANTHROPIC_AUTH_TOKEN", "ANTHROPIC_API_KEY", "ANTHROPIC_BASE_URL"]

# Claude's own permission rules. No Write/Edit: the orchestrator coordinates
# rather than authors, and the denial keeps it from becoming a ghost author of
# the code it delegates.
[runtime.permissions]
allow = ["Read", "Glob", "Grep", "TodoWrite", "Bash(git log:*)", "Bash(git diff:*)"]
ask   = ["WebFetch"]
deny  = ["Bash(sudo *)"]

[sandbox]
network  = true
hostname = "orchestrator"
unshare  = ["pid", "ipc", "uts", "cgroup"]

[[mounts]]
src  = "~/.local/bin/claude"
dest = "/opt/claude/claude"
mode = "ro"

[[mounts]]
src  = "~/.claude"
dest = "/home/agent/.claude"
mode = "copy"

[[mounts]]
src        = "~/capwrap-demo/repo"
dest       = "/work"
mode       = "worktree"
branch     = "capwrap/orchestrator"
base       = "main"
on_destroy = "keep"

[[files]]
# Project memory: Claude reads this from the working directory on its own.
dest = "/work/CLAUDE.md"
src  = "prompts/house.md"

[caps]
parent = ["send"]
peers = [
  { container = "explorer", rights = ["send", "inspect"] },
  { container = "programmer", rights = ["send", "inspect"] },
  { container = "tester", rights = ["send", "inspect"] },
  { container = "reviewer", rights = ["send", "inspect"] },
  { container = "architect", rights = ["send", "inspect"] },
  { container = "writer", rights = ["send", "inspect"] },
]

# Only the orchestrator may create agents, and what it gets over them is fixed
# here rather than by the orchestrator itself.
[caps.factory]
rights       = ["create"]
quota        = { containers = 3 }
child_rights = ["send", "inspect", "read_output", "write_input"]
