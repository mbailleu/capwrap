# explorer: Answer questions about the codebase. Read, never write.
#
# Prompts reach this container three ways, all visible below:
#   1. role_prompt = "prompts/explorer.md" is bound at /run/capwrap-role.md
#      and wired into the system prompt (Claude reads it via a flag capwrap inserts)
#   2. prompts/house.md is bound in as /work/CLAUDE.md, the project memory
#   3. the worktree is the working context
#
#   capwrap up examples/team/*.toml

name = "explorer"

[runtime]
command = [
  "/opt/claude/claude",
]
# The role is a *system* prompt, not a message: it survives compaction and the
# agent cannot talk itself out of it mid-session. capwrap binds the file at
# /run/capwrap-role.md and inserts --append-system-prompt-file after the binary.
role_prompt = "prompts/explorer.md"
cwd       = "/work"
tty       = true
approvals = "capwrap"

auto_allow = ["Read", "Glob", "Grep", "TodoWrite"]
auto_deny  = ["Bash(sudo *)"]

env_from_host = ["ANTHROPIC_AUTH_TOKEN", "ANTHROPIC_API_KEY", "ANTHROPIC_BASE_URL"]

# Claude's own permission rules. A reviewer that *cannot* write is a stronger
# claim than one merely told not to.
[runtime.permissions]
allow = ["Read", "Glob", "Grep", "TodoWrite", "Bash(git log:*)", "Bash(git grep:*)"]
ask   = ["WebFetch"]
deny  = ["Write", "Edit", "Bash(sudo *)"]

[sandbox]
network  = true
hostname = "explorer"
unshare  = ["pid", "ipc", "uts", "cgroup"]

[[mounts]]
src  = "~/.local/bin/claude"
dest = "/opt/claude/claude"
mode = "ro"

[[mounts]]
src  = "~/.claude"
dest = "/home/agent/.claude"
mode = "copy"

[[mounts]]
src        = "~/capwrap-demo/repo"
dest       = "/work"
mode       = "worktree"
branch     = "capwrap/explorer"
base       = "main"
on_destroy = "keep"

[[files]]
# Project memory: Claude reads this from the working directory on its own.
dest = "/work/CLAUDE.md"
src  = "prompts/house.md"

[caps]
parent = ["send"]
peers = [
  { container = "orchestrator", rights = ["send", "inspect"] },
  { container = "programmer", rights = ["send", "inspect"] },
  { container = "architect", rights = ["send", "inspect"] },
]
