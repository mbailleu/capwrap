[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "capwrap"
version = "0.1.0"
description = "Capability-governed bubblewrap containers for isolating AI coding agents"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2",
    "websockets",
    "pyte",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "httpx"]

[project.scripts]
capwrap = "capwrap.cli:main"

[tool.setuptools.packages.find]
include = ["capwrap*"]

[tool.setuptools.package-data]
capwrap = ["web/static/**/*", "guest/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "sandbox: requires a working bwrap (skipped when `capwrap doctor` is unhappy)",
]
